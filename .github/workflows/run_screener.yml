name: Run screener daily and publish site

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 23 * * 1-5"

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ✅ NEW: Cache your price history between runs
      - name: Cache price data
        uses: actions/cache@v4
        with:
          path: data_cache
          key: ycache-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ycache-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run screener
        run: |
          python screener.py

      - name: Commit updated site files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Make sure we're on main and up to date BEFORE generating changes
          git checkout main
          git fetch origin main
          git reset --hard origin/main

          # Stage generated site output
          git add docs/ || true

          # Commit only if there are changes
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Update screener output"

          # Push (no pull/rebase)
          git push origin main
