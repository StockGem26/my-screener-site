<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>2025 Strategy Replay</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body{
  font-family:Inter, sans-serif;
  margin:0;
  background:#f5f7fa;
  color:#0f172a;
}
.container{
  max-width:1000px;
  margin:40px auto;
  padding:20px;
}
h1{
  font-size:36px;
  margin-bottom:10px;
}
.controls{
  display:flex;
  gap:20px;
  margin:20px 0;
  flex-wrap:wrap;
}
select{
  padding:8px 12px;
  border-radius:8px;
  border:1px solid #ccc;
  font-weight:600;
}
.stats{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
  gap:15px;
  margin-top:20px;
}
.card{
  background:white;
  padding:18px;
  border-radius:14px;
  box-shadow:0 10px 30px rgba(0,0,0,.06);
}
.card h3{
  margin:0 0 8px 0;
  font-size:14px;
  color:#64748b;
}
.card .value{
  font-size:22px;
  font-weight:800;
}
.pos{color:#16a34a;}
.neg{color:#dc2626;}
</style>
</head>

<body>
<div class="container">
  <h1>2025 Strategy Replay</h1>
  <div>Entry: Signal-day close | Stop: Exit at stop price if low breaches</div>

  <div class="controls">
    <div>
      Stop:
      <select id="stopSelect">
        <option value="off">Off</option>
        <option value="stop5">5%</option>
        <option value="stop6">6%</option>
        <option value="stop7">7%</option>
        <option value="stop8">8%</option>
      </select>
    </div>

    <div>
      Horizon:
      <select id="horizonSelect">
        <option value="15">15D</option>
        <option value="30">30D</option>
        <option value="60">60D</option>
        <option value="100">100D</option>
        <option value="200">200D</option>
      </select>
    </div>
  </div>

  <div class="stats" id="stats"></div>
</div>

<script>
let summaryData = null;

function fmt(x){
  if(x === null || x === undefined) return "—";
  if(typeof x === "number"){
    return x.toFixed(2) + "%";
  }
  return x;
}

function fmtPF(x){
  if(x === null || x === undefined) return "—";
  if(!isFinite(x)) return "∞";
  return x.toFixed(2);
}

function render(){
  const stop = document.getElementById("stopSelect").value;
  const horizon = document.getElementById("horizonSelect").value;

  const stats = summaryData.stats[stop][horizon];
  const container = document.getElementById("stats");
  container.innerHTML = "";

  function addCard(label, value, cls=""){
    container.innerHTML += `
      <div class="card">
        <h3>${label}</h3>
        <div class="value ${cls}">${value}</div>
      </div>
    `;
  }

  addCard("Total Trades", stats.count);
  addCard("Win Rate", fmt(stats.win_rate));
  addCard("Avg Gain", fmt(stats.avg_gain), "pos");
  addCard("Avg Loss", fmt(stats.avg_loss), "neg");
  addCard("Expectancy", fmt(stats.expectancy), stats.expectancy > 0 ? "pos":"neg");
  addCard("Profit Factor", fmtPF(stats.profit_factor));

  if(stats.stop_hit_rate !== null){
    addCard("Stop Hit Rate", fmt(stats.stop_hit_rate));
  }
}

fetch("summary.json")
  .then(res => res.json())
  .then(data => {
    summaryData = data;
    render();
  });

document.getElementById("stopSelect").addEventListener("change", render);
document.getElementById("horizonSelect").addEventListener("change", render);
</script>

</body>
</html>
